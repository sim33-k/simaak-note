# Trigger CI
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:  
  builds:  
    runs-on: ubuntu-latest
    steps:  
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci
      - run: npm run build

    # Saving build output as artifact

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: nextjs-build
          path: .next/
